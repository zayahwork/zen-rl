[project]
name = "zen-rl"
version = "0.1.0"
description = "description = "Diagnose failed RL training runs from TensorBoard logs. No LLM, instant, free."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "tbparse>=0.0.9",
    "tensorboard>=2.14",
]
]
[tool.setuptools.packages.find]
where = ["."]
include = ["zen*"]

[project.scripts]
zen = "zen.cli:main"